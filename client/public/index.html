<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    
    <title>🕹️ Retro Task Manager | 80s Terminal Style</title>
    
    <!-- Favicon (optional - creates a simple emoji favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>" />
    
    <!-- Meta description for SEO / sharing -->
    <meta name="description" content="A retro 80s/90s themed task manager with CRT glow effects" />
    <meta name="author" content="JoJaCo" />
    
    <!-- Preconnect for faster font loading (optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Retro monospace font (better than default Courier) -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
    
    <style>
      /* Global retro reset - inlined here for immediate loading */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: radial-gradient(circle at center, #0a1f0a 0%, #000000 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        padding: 20px;
      }
      
      /* CRT flicker animation */
      @keyframes flicker {
        0% { opacity: 0.97; }
        5% { opacity: 0.95; }
        10% { opacity: 0.98; }
        15% { opacity: 0.94; }
        20% { opacity: 1; }
        100% { opacity: 1; }
      }
      
      /* Terminal cursor blink */
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      
      /* The glowing border effect */
      .crt-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.05);
        animation: flicker 8s infinite;
      }
      
      /* Scanline overlay */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 255, 0, 0.03) 0px,
          rgba(0, 255, 0, 0.03) 2px,
          transparent 2px,
          transparent 4px
        );
        z-index: 9998;
      }
      
      /* Boot screen text (displays briefly) */
      .boot-text {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: #0f0;
        font-size: 10px;
        opacity: 0.5;
        font-family: monospace;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <!-- CRT Effects (these stay on top of React app) -->
    <div class="crt-glow"></div>
    <div class="scanlines"></div>
    <div class="boot-text">
      ⚡ SYSTEM READY | v1.0 | TERMINAL ACTIVE ⚡
    </div>
    
    <!-- React will mount here -->
    <div id="root"></div>
  </body>
</html>
